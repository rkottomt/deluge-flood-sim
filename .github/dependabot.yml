# Keeps the SHA-pinned GitHub Actions in .github/workflows/pages.yml up to date (Dependabot rewrites both the SHA and
# the trailing version comment), and watches the npm lockfile. See FINDINGS.json SEC-04.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
