<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Deluge — data dev harness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --panel: #121a23;
        --line: #243242;
        --text: #d9e3ec;
        --dim: #8ea0b2;
        --accent: #5cc8ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #stage {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hover {
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: #000a;
        padding: 6px 9px;
        border-radius: 6px;
        font: 12px ui-monospace, Menlo, monospace;
        pointer-events: none;
        white-space: pre;
      }
      aside {
        width: 390px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 14px 16px 40px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 2px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 16px 0 6px;
      }
      .sub {
        color: var(--dim);
      }
      select,
      button,
      input[type='text'] {
        background: #0d141c;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 7px;
        font: inherit;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-right: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td {
        padding: 2px 0;
        vertical-align: top;
      }
      td:first-child {
        color: var(--dim);
        width: 42%;
      }
      .legend span {
        display: inline-block;
        width: 18px;
        height: 4px;
        margin: 0 4px 2px 8px;
        vertical-align: middle;
      }
      #log {
        font: 11px ui-monospace, Menlo, monospace;
        color: var(--dim);
        white-space: pre-wrap;
        max-height: 160px;
        overflow-y: auto;
      }
      .bar {
        height: 4px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.2s;
      }
      .desc {
        font-size: 12px;
        color: #c2cfdb;
      }
      .ok {
        color: #6fe39a;
      }
      .bad {
        color: #ff7b7b;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hover"></div>
    </div>
    <aside>
      <h1 id="title">Deluge data harness</h1>
      <div class="sub" id="subtitle">Loading…</div>
      <div class="bar" style="margin-top: 8px"><div id="progress"></div></div>

      <h2>Source</h2>
      <div>
        <select id="presetSel"></select>
        <button id="loadBtn">Load</button>
      </div>
      <div style="margin-top: 6px">
        <input id="liveInput" type="text" placeholder="lat,lon,sizeMeters[,res]" style="width: 210px" />
        <button id="liveBtn">Live</button>
      </div>

      <h2>Layers</h2>
      <div>
        <label><input type="checkbox" id="lyImagery" checked />imagery</label>
        <label><input type="checkbox" id="lyShade" checked />hillshade</label>
        <label><input type="checkbox" id="lyWater" checked />channel / initial water</label>
      </div>
      <div style="margin-top: 4px">
        <label><input type="checkbox" id="lyRoads" checked />roads</label>
        <label><input type="checkbox" id="lyMarkers" checked />markers</label>
        <label><input type="checkbox" id="lySeeds" checked />seeds</label>
      </div>
      <div class="legend sub" style="margin-top: 6px">
        <span style="background: #ff9f1c"></span>highway<span style="background: #ffe066"></span>major<span
          style="background: #f5f5f5"
        ></span
        >minor<span style="background: #9aa7b3"></span>local
      </div>
      <div class="sub" style="margin-top: 4px">Wheel = zoom, drag = pan, double-click = reset.</div>

      <h2>Terrain</h2>
      <table id="terrainTable"></table>
      <h2>Scenario</h2>
      <div class="desc" id="desc"></div>
      <table id="scenarioTable" style="margin-top: 8px"></table>
      <h2>Checks</h2>
      <table id="checksTable"></table>
      <h2>Log</h2>
      <div id="log"></div>
    </aside>
    <script type="module" src="./data.ts"></script>
  </body>
</html>
