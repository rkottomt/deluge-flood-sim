    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; color: #dfe8f1; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; image-rendering: pixelated; box-shadow: 0 0 0 1px #1f2a36; cursor: crosshair; }
      #hud {
        position: fixed; left: 12px; top: 10px; padding: 8px 11px; border-radius: 8px; min-width: 330px;

        background: rgba(10, 14, 20, 0.72); backdrop-filter: blur(6px); pointer-events: none; white-space: pre;
      }
      #hud b { color: #fff; }
      #hud .bad { color: #ff6b6b; font-weight: bold; }
      #hud .ok { color: #7ee2a8; }
      #legend {
        position: fixed; right: 12px; bottom: 10px; padding: 6px 10px; border-radius: 8px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(10, 14, 20, 0.72);
        pointer-events: none; white-space: pre;
      }
